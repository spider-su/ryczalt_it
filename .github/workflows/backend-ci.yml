name: Backend CI

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "docs/migration/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "apps/backend/**"
      - "docs/migration/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/backend

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml
      - name: Verify backend, integration tests, and migrations
        run: mvn -B verify
      - name: Build backend container
        run: docker build --tag ryczalt-backend:${{ github.sha }} .
