name: Backend CI

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "docs/migration/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "apps/backend/**"
      - "docs/migration/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml
      - name: Run unit, integration, and migration tests
        run: mvn --batch-mode --no-transfer-progress clean verify

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify Docker build context
        run: |
          test -f apps/backend/Dockerfile
          test -f apps/backend/pom.xml
      - name: Build backend image without publishing
        uses: docker/build-push-action@v7
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: false
          tags: ryczalt_it:ci-${{ github.sha }}
          cache-from: type=gha,scope=ryczalt-backend
          cache-to: type=gha,scope=ryczalt-backend,mode=max
