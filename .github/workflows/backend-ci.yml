name: Backend CI

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "docs/**"
      - "tools/check_markdown_links.py"
      - ".github/check_it_registration.py"
      - ".github/workflows/backend-ci.yml"
      - "README.md"
  push:
    branches: [develop, main]
    paths:
      - "apps/backend/**"
      - "docs/**"
      - "tools/check_markdown_links.py"
      - ".github/check_it_registration.py"
      - ".github/workflows/backend-ci.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check integration-test registration
        run: python3 .github/check_it_registration.py
      - name: Check local Markdown links
        run: python3 tools/check_markdown_links.py

  unit:
    name: Unit tests (no Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml
      - name: Run unit tests without integration tests
        run: mvn --batch-mode --no-transfer-progress clean -DskipITs verify

  backend-e2e:
    name: E2E (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: application-smoke
            test: RyczaltApplicationSmokeIT
          - name: standalone-migrations
            test: StandaloneMigrationIT
          - name: accounting-contract
            test: CanonicalAccountingOpenApiIT
          - name: bank-import
            test: RyczaltNativeBankImportIT
          - name: ksef-import
            test: RyczaltNativeKsefImportIT
          - name: period-lifecycle
            test: RyczaltPeriodLifecycleConcurrencyIT
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml
      - name: Run backend end-to-end integration suite
        run: >-
          mvn --batch-mode --no-transfer-progress initialize test-compile
          failsafe:integration-test failsafe:verify
          "-Dit.test=${{ matrix.suite.test }}"
          -Dfailsafe.failIfNoSpecifiedTests=false

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit, backend-e2e, docs]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify Docker build context
        run: |
          test -f apps/backend/Dockerfile
          test -f apps/backend/pom.xml
      - name: Build backend image for runtime smoke
        uses: docker/build-push-action@v7
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: false
          load: true
          tags: ryczalt_it:ci-${{ github.sha }}
          cache-from: type=gha,scope=ryczalt-backend
          cache-to: type=gha,scope=ryczalt-backend,mode=max
      - name: Start backend container and verify health
        run: ./apps/backend/scripts/smoke-container.sh "ryczalt_it:ci-${{ github.sha }}"
