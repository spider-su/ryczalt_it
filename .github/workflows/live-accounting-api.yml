name: Live Accounting API

on:
  workflow_dispatch:
    inputs:
      month:
        description: Accounting month (YYYY-MM; blank uses current UTC month)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://investory-61359240267.europe-central2.run.app
      PROFILE_ID: '1'
      TEST_USER: ${{ secrets.INVESTORY_TEST_USER }}
      TEST_PASSWORD: ${{ secrets.INVESTORY_TEST_PASSWORD }}
      REQUESTED_MONTH: ${{ inputs.month }}
    steps:
      - name: Run live accounting API smoke
        id: smoke
        shell: bash
        run: |
          set -uo pipefail

          ARTIFACT_DIR="$RUNNER_TEMP/investory-live-api"
          mkdir -p "$ARTIFACT_DIR"
          PASS=0
          WARN=0
          FAIL=0
          MONTH="${REQUESTED_MONTH:-}"
          if [[ -z "$MONTH" ]]; then
            MONTH="$(date -u +%Y-%m)"
          fi

          echo "::add-mask::$TEST_USER"
          echo "::add-mask::$TEST_PASSWORD"

          fail_check() {
            FAIL=$((FAIL + 1))
            echo "FAIL: $1"
          }

          pass_check() {
            PASS=$((PASS + 1))
            echo "PASS: $1"
          }

          warn_check() {
            WARN=$((WARN + 1))
            echo "WARN: $1"
          }

          request() {
            local name="$1"
            local method="$2"
            local path="$3"
            local auth="${4:-yes}"
            local body="$ARTIFACT_DIR/${name}.body"
            local status_file="$ARTIFACT_DIR/${name}.status"
            local rc_file="$ARTIFACT_DIR/${name}.rc"
            local stderr_file="$ARTIFACT_DIR/${name}.stderr"
            local status
            local rc
            local -a args=(
              --silent
              --show-error
              --location
              --connect-timeout 10
              --max-time 30
              --request "$method"
              --header "Accept: application/json"
              --output "$body"
              --write-out '%{http_code}'
            )

            if [[ "$auth" == "yes" ]]; then
              args+=(--user "$TEST_USER:$TEST_PASSWORD")
            fi

            status="$(curl "${args[@]}" "${BASE_URL}${path}" 2>"$stderr_file")"
            rc=$?
            printf '%s\n' "$status" > "$status_file"
            printf '%s\n' "$rc" > "$rc_file"
          }

          safe_body_summary() {
            local name="$1"
            local body="$ARTIFACT_DIR/${name}.body"
            local summary="$ARTIFACT_DIR/${name}.body.safe"

            if [[ -s "$body" ]] && jq -e . "$body" >/dev/null 2>&1; then
              jq -c '
                if type == "array" then
                  {type: "array", length: length, firstItemKeys: (if (length > 0) and ((.[0] | type) == "object") then (.[0] | keys | sort) else [] end)}
                elif type == "object" then
                  {type: "object", keys: (keys | sort)}
                else
                  {type: type}
                end
              ' "$body" > "$summary"
              mv "$summary" "$body"
            else
              printf '%s\n' '{"response":"empty-or-non-json"}' > "$body"
            fi
          }

          if [[ -z "$TEST_USER" ]]; then
            echo '::error::Missing repository secret INVESTORY_TEST_USER'
            fail_check 'credential preflight: INVESTORY_TEST_USER is missing'
          fi
          if [[ -z "$TEST_PASSWORD" ]]; then
            echo '::error::Missing repository secret INVESTORY_TEST_PASSWORD'
            fail_check 'credential preflight: INVESTORY_TEST_PASSWORD is missing'
          fi

          if [[ -n "$TEST_USER" && -n "$TEST_PASSWORD" ]]; then
            request openapi GET /v3/api-docs yes
            request openapi-unauthenticated GET /v3/api-docs no

            OPENAPI_STATUS="$(cat "$ARTIFACT_DIR/openapi.status")"
            OPENAPI_RC="$(cat "$ARTIFACT_DIR/openapi.rc")"
            OPENAPI_VALID=false
            if [[ "$OPENAPI_RC" == "0" && "$OPENAPI_STATUS" == "200" ]] && jq -e '.paths | type == "object"' "$ARTIFACT_DIR/openapi.body" >/dev/null 2>&1; then
              cp "$ARTIFACT_DIR/openapi.body" "$ARTIFACT_DIR/openapi.json"
              OPENAPI_VALID=true
              pass_check "OpenAPI authenticated: HTTP $OPENAPI_STATUS"
            else
              fail_check "OpenAPI authenticated: curl rc=$OPENAPI_RC HTTP=$OPENAPI_STATUS or invalid paths schema"
            fi

            OPENAPI_UNAUTH_STATUS="$(cat "$ARTIFACT_DIR/openapi-unauthenticated.status")"
            OPENAPI_UNAUTH_RC="$(cat "$ARTIFACT_DIR/openapi-unauthenticated.rc")"
            if [[ "$OPENAPI_UNAUTH_RC" == "0" && "$OPENAPI_UNAUTH_STATUS" == "200" ]]; then
              warn_check 'OpenAPI unauthenticated: HTTP 200 (public OpenAPI allowed)'
            elif [[ "$OPENAPI_UNAUTH_RC" == "0" ]]; then
              warn_check "OpenAPI unauthenticated: HTTP $OPENAPI_UNAUTH_STATUS"
            else
              warn_check "OpenAPI unauthenticated: curl rc=$OPENAPI_UNAUTH_RC HTTP=$OPENAPI_UNAUTH_STATUS"
            fi

            if [[ "$OPENAPI_VALID" == true ]]; then
              jq -r '
                .paths
                | to_entries[]
                | select(.key | ascii_downcase | contains("accounting"))
                | .key as $path
                | .value
                | to_entries[]
                | select(.key | IN("get", "post", "put", "patch", "delete"))
                | "\(.key | ascii_upcase) \($path)"
              ' "$ARTIFACT_DIR/openapi.json" | sort -u > "$ARTIFACT_DIR/accounting-operations.txt"
              jq -r '.paths | keys[] | select((ascii_downcase | contains("payment")) or (ascii_downcase | contains("settlement")))' "$ARTIFACT_DIR/openapi.json" | sort -u > "$ARTIFACT_DIR/payment-route-candidates.txt"
              jq -r '.paths | keys[] | select((ascii_downcase | contains("document")) or (ascii_downcase | contains("recognize")) or (ascii_downcase | contains("counterpart")))' "$ARTIFACT_DIR/openapi.json" | sort -u > "$ARTIFACT_DIR/document-route-candidates.txt"
              pass_check 'Accounting OpenAPI discovery'
            else
              : > "$ARTIFACT_DIR/accounting-operations.txt"
              : > "$ARTIFACT_DIR/payment-route-candidates.txt"
              : > "$ARTIFACT_DIR/document-route-candidates.txt"
              fail_check 'Accounting OpenAPI discovery unavailable'
            fi

            request accounting-month GET "/api/v1/profiles/$PROFILE_ID/accounting/months/$MONTH" yes
            MONTH_STATUS="$(cat "$ARTIFACT_DIR/accounting-month.status")"
            MONTH_RC="$(cat "$ARTIFACT_DIR/accounting-month.rc")"
            if [[ "$MONTH_RC" == "28" ]]; then
              fail_check "ACCOUNTING_MONTH_TIMEOUT: curl rc=28 HTTP=$MONTH_STATUS"
            elif [[ "$MONTH_RC" != "0" ]]; then
              fail_check "Accounting month transport failure: curl rc=$MONTH_RC HTTP=$MONTH_STATUS"
            elif [[ "$MONTH_STATUS" != "200" ]]; then
              fail_check "Accounting month: HTTP $MONTH_STATUS"
            else
              pass_check 'Accounting month: HTTP 200'
            fi

            request documents GET "/api/v1/profiles/$PROFILE_ID/accounting/months/$MONTH/documents" yes
            DOCUMENTS_STATUS="$(cat "$ARTIFACT_DIR/documents.status")"
            DOCUMENTS_RC="$(cat "$ARTIFACT_DIR/documents.rc")"
            if [[ "$DOCUMENTS_RC" != "0" ]]; then
              fail_check "Documents transport failure: curl rc=$DOCUMENTS_RC HTTP=$DOCUMENTS_STATUS"
            elif [[ "$DOCUMENTS_STATUS" != "200" ]]; then
              fail_check "Documents: HTTP $DOCUMENTS_STATUS"
            else
              pass_check 'Documents: HTTP 200'
            fi
            safe_body_summary documents

            request payment-history GET "/api/v1/profiles/$PROFILE_ID/accounting/payments/history" yes
            PAYMENT_STATUS="$(cat "$ARTIFACT_DIR/payment-history.status")"
            PAYMENT_RC="$(cat "$ARTIFACT_DIR/payment-history.rc")"
            if [[ "$PAYMENT_RC" != "0" ]]; then
              fail_check "Payment history transport failure: curl rc=$PAYMENT_RC HTTP=$PAYMENT_STATUS"
            elif [[ "$PAYMENT_STATUS" == "404" ]]; then
              fail_check 'PAYMENT_HISTORY_ROUTE_MISMATCH: expected mobile route returned HTTP 404'
            elif [[ "$PAYMENT_STATUS" != "200" ]]; then
              fail_check "Payment history: HTTP $PAYMENT_STATUS"
            else
              pass_check 'Payment history: HTTP 200'
            fi
            safe_body_summary payment-history

            safe_body_summary openapi-unauthenticated
            printf '%s\n' '{"response":"saved-as-openapi.json"}' > "$ARTIFACT_DIR/openapi.body"
          else
            : > "$ARTIFACT_DIR/accounting-operations.txt"
            : > "$ARTIFACT_DIR/payment-route-candidates.txt"
            : > "$ARTIFACT_DIR/document-route-candidates.txt"
          fi

          OPENAPI_STATUS="${OPENAPI_STATUS:-000}"
          OPENAPI_UNAUTH_STATUS="${OPENAPI_UNAUTH_STATUS:-000}"
          MONTH_STATUS="${MONTH_STATUS:-000}"
          MONTH_RC="${MONTH_RC:-not-run}"
          DOCUMENTS_STATUS="${DOCUMENTS_STATUS:-000}"
          PAYMENT_STATUS="${PAYMENT_STATUS:-000}"

          {
            echo '# Live Accounting API Smoke'
            echo
            echo "- Base URL: $BASE_URL"
            echo "- Profile: $PROFILE_ID"
            echo "- Month: $MONTH"
            echo
            echo "- OpenAPI authenticated HTTP: $OPENAPI_STATUS"
            echo "- OpenAPI unauthenticated HTTP: $OPENAPI_UNAUTH_STATUS"
            echo
            echo '| Check | HTTP | curl | Result |'
            echo '| --- | ---: | ---: | --- |'
            if [[ "$MONTH_RC" == "28" ]]; then MONTH_RESULT='FAIL (ACCOUNTING_MONTH_TIMEOUT)'; else MONTH_RESULT='see job log'; fi
            if [[ "${DOCUMENTS_RC:-not-run}" == "0" && "$DOCUMENTS_STATUS" == "200" ]]; then DOCUMENTS_RESULT='PASS'; else DOCUMENTS_RESULT='FAIL'; fi
            if [[ "${PAYMENT_RC:-not-run}" == "0" && "$PAYMENT_STATUS" == "200" ]]; then PAYMENT_RESULT='PASS'; else PAYMENT_RESULT='FAIL'; fi
            echo "| Accounting month | $MONTH_STATUS | $MONTH_RC | $MONTH_RESULT |"
            echo "| Documents | $DOCUMENTS_STATUS | ${DOCUMENTS_RC:-not-run} | $DOCUMENTS_RESULT |"
            echo "| Payment history | $PAYMENT_STATUS | ${PAYMENT_RC:-not-run} | $PAYMENT_RESULT |"
            echo
            echo "Overall failure count: $FAIL"
            echo
            echo '## Payment/settlement route candidates'
            sed 's/^/- `&`/' "$ARTIFACT_DIR/payment-route-candidates.txt" || true
            echo
            echo '## Document/recognition route candidates'
            sed 's/^/- `&`/' "$ARTIFACT_DIR/document-route-candidates.txt" || true
          } | tee "$ARTIFACT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$FAIL" -gt 0 ]]; then
            exit 1
          fi

      - name: Upload live API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-accounting-api-${{ github.run_id }}
          path: ${{ runner.temp }}/investory-live-api
          retention-days: 7
          if-no-files-found: error
