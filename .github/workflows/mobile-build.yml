name: Local Android APK

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      EXPO_PUBLIC_PRODUCT_TIER: 'free'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm ci
      - run: npm run ci
      - run: npx expo-doctor
      - name: Generate native Android project locally
        run: npx expo prebuild --clean --platform android --no-install
      - name: Assemble standalone release APK locally
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify bundled JavaScript in release APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apks = list(Path('android/app/build/outputs/apk/release').glob('*.apk'))
          assert len(apks) == 1, f'Expected one release APK, got {apks}'
          with ZipFile(apks[0]) as archive:
              names = archive.namelist()
              assert any(name.endswith('index.android.bundle') for name in names), 'Standalone JavaScript bundle missing from APK'
          print(f'Validated standalone JS bundle: {apks[0]}')
          PY
      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: ryczalt-it-standalone-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
