spring:
  application:
    name: ryczalt-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ryczalt}
    username: ${DATABASE_USER:ryczalt}
    password: ${DATABASE_PASSWORD:ryczalt}
  flyway:
    locations: classpath:sql/migration
    schemas: ryczalt
    default-schema: ryczalt
    create-schemas: true
  jpa:
    properties:
      hibernate:
        default_schema: ryczalt

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    profile-ownership-required: true
    token-secret: ${RYCZALT_TOKEN_SECRET}
    token-lifetime: PT12H
    mobile-api-allowed-origins: ${RYCZALT_ALLOWED_ORIGINS:http://localhost:8081}
  integrations:
    master-key: ${RYCZALT_INTEGRATION_MASTER_KEY:}
