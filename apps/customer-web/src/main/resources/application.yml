ryczalt:
  backend:
    base-url: ${RYCZALT_BACKEND_URL:}

server:
  tomcat:
    max-http-form-post-size: 11MB
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax
