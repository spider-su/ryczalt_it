<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Ryczałt</title>
  <link rel="stylesheet" th:href="@{/css/accounting.css}">
</head>
<body class="customer-login-page">
  <main class="customer-login-card">
    <h1>Sign in to Ryczałt</h1>
    <p>Use your Ryczałt account to access your accounting profile.</p>
    <div class="customer-login-message" role="alert" th:if="${loginError}">We could not sign you in. Check your credentials or try again later.</div>
    <div class="customer-login-message" role="status" th:if="${sessionExpired}">Your session expired. Sign in again to continue.</div>
    <div class="customer-login-message" role="status" th:if="${loggedOut}">You have been signed out.</div>
    <form method="post" th:action="@{/login}">
      <label for="username">Email or username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
